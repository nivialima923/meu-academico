
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Acadêmico</title>
<style>
:root{
  --green:#5f7d69; --green2:#e7efe8; --cream:#faf8f1; --ink:#243028;
  --muted:#788078; --line:#e4e4dc; --red:#df5961; --yellow:#e9b94c;
  --blue:#6da7d8; --purple:#9b83cf; --shadow:0 8px 25px rgba(43,57,47,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef2ed;color:var(--ink)}
button,input,select,textarea{font:inherit}
.app{min-height:100vh;display:flex}
.sidebar{width:230px;background:var(--green);color:white;padding:24px 16px;position:fixed;inset:0 auto 0 0}
.logo{font-family:Georgia,serif;font-size:28px;line-height:1.05;margin:8px 12px 8px}
.tag{font-family:Georgia,serif;font-style:italic;opacity:.85;margin:0 12px 32px}
.nav button{width:100%;border:0;background:transparent;color:white;text-align:left;padding:13px 14px;border-radius:12px;margin:3px 0;cursor:pointer}
.nav button.active,.nav button:hover{background:rgba(255,255,255,.2)}
.main{margin-left:230px;padding:28px;max-width:1250px;width:100%;margin-right:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
h1,h2,h3{font-family:Georgia,serif;margin:0 0 7px}
.sub{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.card{background:var(--cream);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.stat{padding:18px}
.stat b{font-size:26px;display:block}
.grid{display:grid;grid-template-columns:1fr 330px;gap:18px}
.section{padding:20px;margin-bottom:18px}
.task{display:grid;grid-template-columns:12px 75px 1fr auto auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:50%}
.prova{background:var(--red)} .trabalho{background:var(--green)} .seminario{background:var(--blue)}
.lista{background:var(--yellow)} .outro{background:var(--purple)}
.date{font-weight:bold}.small{font-size:13px;color:var(--muted)}
.badge{padding:6px 10px;border-radius:999px;background:#f3e3d8;font-size:12px}
.complete{border:0;background:#dfe9df;color:#42614b;padding:6px 10px;border-radius:9px;cursor:pointer}
.calendar{padding:18px}.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.calhead button{border:1px solid var(--line);background:white;border-radius:8px;width:34px;height:34px;cursor:pointer}
.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.weekdays div{font-size:11px;color:var(--muted);text-align:center;padding:6px 0}
.day{min-height:38px;border:0;background:transparent;border-radius:9px;cursor:pointer;position:relative}
.day:hover{background:var(--green2)}
.day.today{background:var(--green);color:white}
.day.has:after{content:"";position:absolute;bottom:3px;left:50%;width:5px;height:5px;border-radius:50%;background:var(--red);transform:translateX(-50%)}
.form{max-width:700px}
.field{margin-bottom:14px}.field label{display:block;font-weight:bold;margin-bottom:6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #d8d9d1;border-radius:10px;background:white}
textarea{min-height:90px;resize:vertical}
.btn{border:0;border-radius:10px;padding:12px 18px;background:var(--green);color:white;cursor:pointer}
.btn.secondary{background:#e7ece7;color:#38513f}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:800px){
 .sidebar{position:static;width:100%;height:auto;display:flex;align-items:center;padding:10px}
 .logo,.tag{display:none}.nav{display:flex;width:100%;overflow:auto}.nav button{white-space:nowrap}
 .app{display:block}.main{margin:0;padding:15px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}
 .task{grid-template-columns:10px 65px 1fr}.task .badge,.task .complete{grid-column:3}
}
</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5f7d69">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meu Acadêmico">
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo">Meu<br>Acadêmico</div>
  <div class="tag">Planeje hoje,<br>conquiste amanhã.</div>
  <nav class="nav">
    <button data-page="inicio" class="active">⌂ &nbsp; Início</button>
    <button data-page="calendario">▣ &nbsp; Calendário</button>
    <button data-page="tarefas">☷ &nbsp; Minhas tarefas</button>
    <button data-page="adicionar">＋ &nbsp; Adicionar tarefa</button>
    <button data-page="concluidas">✓ &nbsp; Concluídas</button>
  </nav>
</aside>

<main class="main" id="app"></main>
</div>

<script>
const initial = [
 {id:1,date:"2026-09-25",subject:"Currículo e Avaliação da Aprendizagem em Ciências da Natureza",title:"Seminário I",type:"seminario",done:false},
 {id:2,date:"2026-09-30",subject:"Química Analítica I",title:"Avaliação 1",type:"prova",done:false},
 {id:3,date:"2026-10-01",subject:"Físico-química Experimental II",title:"Avaliação 1",type:"prova",done:false},
 {id:4,date:"2026-11-04",subject:"Química Analítica I",title:"Avaliação 2",type:"prova",done:false},
 {id:5,date:"2026-12-01",subject:"Interdisciplinaridade no Ensino de Ciências",title:"Avaliação",type:"prova",done:false},
 {id:6,date:"2026-12-03",subject:"Físico-química Experimental II",title:"Avaliação 2",type:"prova",done:false},
 {id:7,date:"2026-12-04",subject:"Currículo e Avaliação da Aprendizagem em Ciências da Natureza",title:"Seminário II",type:"seminario",done:false},
 {id:8,date:"2026-12-09",subject:"Química Analítica I",title:"Avaliação 3",type:"prova",done:false},
 {id:9,date:"2026-12-16",subject:"Química Analítica I",title:"Avaliação Adicional",type:"outro",done:false},
 {id:10,date:"2026-09-11",subject:"Físico-química III",title:"Avaliação 1 + Entrega da lista 1",type:"lista",done:false}
];
let tasks=JSON.parse(localStorage.getItem("meuAcademico"))||initial;
let page="inicio";
let calDate=new Date(2026,8,22);

const fmt=d=>new Intl.DateTimeFormat("pt-BR",{day:"2-digit",month:"2-digit"}).format(new Date(d+"T12:00:00"));
const longDate=d=>new Intl.DateTimeFormat("pt-BR",{weekday:"long",day:"2-digit",month:"long"}).format(new Date(d+"T12:00:00"));
const save=()=>localStorage.setItem("meuAcademico",JSON.stringify(tasks));
const typeName=t=>({prova:"Prova",trabalho:"Trabalho",seminario:"Seminário",lista:"Entrega de lista",outro:"Outro"}[t]||"Outro");
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function taskHTML(t){
 return `<div class="task">
   <span class="dot ${t.type}"></span>
   <span class="date">${fmt(t.date)}<br><span class="small">${new Intl.DateTimeFormat("pt-BR",{weekday:"short"}).format(new Date(t.date+"T12:00:00"))}</span></span>
   <div><b>${esc(t.subject)}</b><div class="small">${esc(t.title)}</div></div>
   <span class="badge">${t.done?"Concluída":typeName(t.type)}</span>
   ${t.done?"":`<button class="complete" onclick="completeTask(${t.id})">Concluir</button>`}
 </div>`;
}
function upcoming(){
 return tasks.filter(t=>!t.done).sort((a,b)=>a.date.localeCompare(b.date));
}
function home(){
 let up=upcoming(), done=tasks.filter(t=>t.done);
 let today=new Date(); today.setHours(0,0,0,0);
 let month=tasks.filter(t=>t.date.startsWith("2026-09")||t.date.startsWith("2026-10")||t.date.startsWith("2026-11")||t.date.startsWith("2026-12")).length;
 return `<div class="top"><div><h1>Olá! 👋</h1><div class="sub">Aqui estão suas próximas entregas.</div></div><div class="sub">${longDate("2026-09-22")}</div></div>
 <div class="stats">
  <div class="card stat"><span class="small">Pendentes</span><b>${up.length}</b></div>
  <div class="card stat"><span class="small">Concluídas</span><b>${done.length}</b></div>
  <div class="card stat"><span class="small">Este semestre</span><b>${month}</b></div>
  <div class="card stat"><span class="small">Semestre</span><b>2º/2026</b></div>
 </div>
 <div class="grid"><div>
   <section class="card section"><h2>Próximas entregas</h2><div class="sub" style="margin-bottom:12px">Organizadas automaticamente pela data.</div>
   ${up.slice(0,6).map(taskHTML).join("")||'<div class="empty">Tudo em dia! 🎉</div>'}</section>
 </div><div class="card calendar">${calendarHTML()}</div></div>`;
}
function calendarHTML(){
 let y=calDate.getFullYear(),m=calDate.getMonth(), first=new Date(y,m,1), start=first.getDay(), days=new Date(y,m+1,0).getDate();
 let cells="";
 for(let i=0;i<start;i++) cells+="<div></div>";
 for(let d=1;d<=days;d++){
   let iso=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
   let has=tasks.some(t=>t.date===iso&&!t.done);
   let today=iso==="2026-09-22"?"today":"";
   cells+=`<button class="day ${today} ${has?"has":""}" onclick="showDay('${iso}')">${d}</button>`;
 }
 return `<div class="calhead"><button onclick="prevMonth()">‹</button><h3>${new Intl.DateTimeFormat("pt-BR",{month:"long",year:"numeric"}).format(calDate)}</h3><button onclick="nextMonth()">›</button></div>
 <div class="weekdays">${["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"].map(x=>`<div>${x}</div>`).join("")}</div><div class="days">${cells}</div>`;
}
function calendarPage(){return `<div class="top"><div><h1>Calendário</h1><div class="sub">Clique em um dia para ver as tarefas.</div></div></div><div class="grid"><div class="card calendar" style="padding:25px">${calendarHTML()}</div><section class="card section"><h2>Tarefas</h2><div id="dayList" class="empty">Selecione uma data no calendário.</div></section></div>`}
function tasksPage(showDone=false){
 let arr=tasks.filter(t=>showDone?t.done:!t.done).sort((a,b)=>a.date.localeCompare(b.date));
 return `<div class="top"><div><h1>${showDone?"Concluídas":"Minhas tarefas"}</h1><div class="sub">${showDone?"Seu histórico de atividades.":"Tudo o que ainda precisa ser feito."}</div></div></div>
 <section class="card section">${arr.map(taskHTML).join("")||'<div class="empty">Nenhuma tarefa por aqui.</div>'}</section>`;
}
function addPage(){
 return `<div class="top"><div><h1>Adicionar tarefa</h1><div class="sub">Cadastre apenas o que realmente importa.</div></div></div>
 <section class="card section form">
 <div class="field"><label>Disciplina</label><input id="subject" placeholder="Ex.: Química Analítica I"></div>
 <div class="field"><label>Atividade</label><input id="title" placeholder="Ex.: Trabalho, seminário, prova..."></div>
 <div class="field"><label>Data</label><input id="date" type="date"></div>
 <div class="field"><label>Tipo</label><select id="type"><option value="prova">Prova</option><option value="trabalho">Trabalho</option><option value="seminario">Seminário</option><option value="lista">Entrega de lista</option><option value="outro">Outro</option></select></div>
 <div class="field"><label>Observações (opcional)</label><textarea id="notes" placeholder="Algum detalhe importante..."></textarea></div>
 <button class="btn" onclick="addTask()">Salvar tarefa</button></section>`;
}
function render(){
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
 document.getElementById("app").innerHTML=page==="inicio"?home():page==="calendario"?calendarPage():page==="tarefas"?tasksPage(false):page==="adicionar"?addPage():tasksPage(true);
}
function completeTask(id){let t=tasks.find(x=>x.id===id);if(t){t.done=true;save();render()}}
function addTask(){
 let subject=document.getElementById("subject").value.trim(),title=document.getElementById("title").value.trim(),date=document.getElementById("date").value,type=document.getElementById("type").value;
 if(!subject||!title||!date){alert("Preencha disciplina, atividade e data.");return}
 tasks.push({id:Date.now(),subject,title,date,type,done:false});save();page="tarefas";render();
}
function showDay(iso){
 let list=tasks.filter(t=>t.date===iso);
 const box=document.getElementById("dayList");
 if(box) box.innerHTML=`<h3>${fmt(iso)}</h3>${list.length?list.map(taskHTML).join(""):'<div class="empty">Nenhuma tarefa neste dia.</div>'}`;
}
function prevMonth(){calDate.setMonth(calDate.getMonth()-1);render()}
function nextMonth(){calDate.setMonth(calDate.getMonth()+1);render()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});
render();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
}
</script>
</body>
</html>
